<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Solicitar Instrumento | Préstamo de Instrumentos</title>
  <link rel="stylesheet" href="estilos.css" />
</head>
<body>
  <header>
    <h1>Solicitud de Préstamo</h1>
    <p id="usuario"></p>
  </header>

  <main>
    <form id="formularioPrestamo">
      <label for="nombre">Nombre completo:</label>
      <input type="text" id="nombre" required />

      <label for="rol">Rol:</label>
      <select id="rol" required>
        <option value="">--Selecciona--</option>
        <option value="Alumno">Alumno</option>
        <option value="Maestro">Maestro</option>
      </select>

      <label for="instrumento">Instrumento:</label>
      <select id="instrumento" required>
        <option value="">--Selecciona--</option>
        <option value="Violín">Violín</option>
        <option value="Guitarra">Guitarra</option>
        <option value="Flauta">Flauta</option>
      </select>

      <label for="municipio">Municipio:</label>
      <input type="text" id="municipio" required />

      <label for="fecha">Fecha de ensayo:</label>
      <input type="date" id="fecha" required />

      <label for="correo">Correo electrónico:</label>
      <input type="email" id="correo" required />

      <button type="submit">Enviar Solicitud</button>
    </form>
  </main>

  <footer>
    <p>Programa de Música © 2025</p>
  </footer>

  <!-- ¡Asegúrate de que script.js esté en la misma carpeta! -->
  <script src="script.js"></script>
</body>
</html>
